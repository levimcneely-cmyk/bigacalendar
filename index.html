<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Outlook">
<meta name="theme-color" content="#1c1c1c">
<title>Annual Outlook</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗓️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1c1c1c; --cell:#2a2a2a; --line:#050505; --ink:#f4f4f4; --muted:#a3a3a3;
  --wkend:#7f7f7f; --brk:#ED7D31; --today:#ffffff;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --bar-h:0px;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Barlow Semi Condensed","Bahnschrift","Arial Narrow",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{padding-bottom:calc(var(--safe-b) + 88px)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:20;background:var(--bg);
  padding:calc(var(--safe-t) + 8px) 10px 8px;border-bottom:2px solid var(--line)}
.bar-row{display:flex;align-items:center;gap:8px}
.year{display:flex;align-items:center;gap:2px;margin-right:auto}
.year h1{margin:0;font-size:34px;font-weight:800;letter-spacing:.5px;line-height:1;min-width:3ch;text-align:center}
.icon-btn{background:none;border:0;width:36px;height:36px;border-radius:8px;font-size:22px;line-height:1;cursor:pointer;color:var(--muted)}
.icon-btn:active{background:#333}
.seg{display:flex;background:#111;border-radius:9px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:600;font-size:15px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:#3a3a3a;color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.chip{font-size:12px;font-weight:600;padding:3px 8px;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.45)}
.summary{margin-top:6px;font-size:13px;color:var(--muted)}
.summary b{color:var(--ink);font-weight:700}
.status{font-size:12px;color:var(--muted);margin-top:4px;min-height:0}
.status:empty{display:none}

/* ---------- grid ---------- */
.wrap{padding:8px 6px}
.grid{display:grid;gap:1px;background:var(--line);border:2px solid var(--line)}
.grid.portrait{grid-template-columns:repeat(12,minmax(0,1fr));
  --fh:clamp(7px,2.05vw,13px);--fb:clamp(7px,2vw,12.5px)}
.grid.landscape{grid-template-columns:52px repeat(31,minmax(40px,1fr));min-width:1350px;
  --fh:11.5px;--fb:11.5px}
.wrap.landscape{overflow-x:auto}

.mh{background:var(--cell);font-weight:800;text-align:center;display:flex;align-items:center;justify-content:center}
.portrait .mh{position:sticky;top:var(--bar-h);z-index:5;font-size:clamp(9px,2.9vw,16px);padding:6px 0;border-bottom:2px solid var(--line)}
.landscape .mh{font-size:14px}
.landscape .dn{background:var(--cell);text-align:center;font-weight:700;font-size:12px;padding:4px 0;color:var(--muted)}
.corner{background:var(--bg)}

.d{background:var(--cell);display:flex;flex-direction:column;min-width:0;cursor:pointer;position:relative}
.d.void{background:var(--bg);cursor:default}
.dh{display:flex;justify-content:space-between;align-items:baseline;gap:2px;
  font-size:var(--fh);font-weight:600;padding:1px 3px;line-height:1.35;white-space:nowrap;overflow:hidden}
.dh.wk{background:var(--wkend)}
.dh.brk{background:var(--brk)}
.db{height:calc(var(--fb) * 1.9);display:flex;align-items:center;justify-content:center;
  font-size:var(--fb);font-weight:600;padding:0 2px;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.5);
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.db span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.d.today{outline:2px solid var(--today);outline-offset:-2px;z-index:2}
.d.sel{outline:2px dashed var(--today);outline-offset:-2px;z-index:3}

/* ---------- day sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:#262626;border-radius:16px 16px 0 0;
  padding:10px 18px calc(var(--safe-b) + 18px);max-height:72vh;overflow-y:auto;
  transform:translateY(105%);transition:transform .25s ease;max-width:560px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:#555;margin:0 auto 10px}
.sheet h2{margin:0 0 12px;font-size:22px;font-weight:700}
.sheet h3{margin:16px 0 6px;font-size:14px;font-weight:600;color:var(--muted)}
.item{display:flex;gap:10px;padding:8px 0;border-top:1px solid #333}
.sw{width:12px;flex:0 0 12px;border-radius:2px;align-self:stretch}
.item-t{font-size:17px;font-weight:700}
.item-s{font-size:14px;color:var(--muted);margin-top:1px}
.empty{color:var(--muted);font-size:15px;margin:4px 0 12px}

/* ---------- add button ---------- */
.fab{border:0;cursor:pointer;position:fixed;right:16px;bottom:calc(var(--safe-b) + 16px);z-index:30;width:58px;height:58px;border-radius:50%;
  background:#FFC000;color:#1c1c1c;font-size:34px;font-weight:700;display:flex;align-items:center;justify-content:center;
  text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.5)}

/* ---------- passcode ---------- */
.gate{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px}
.gate.on{display:flex}
.gate form{width:100%;max-width:320px;text-align:center}
.gate h2{font-size:40px;font-weight:800;margin:0 0 4px}
.gate p{color:var(--muted);margin:0 0 18px}
.gate input{width:100%;font:inherit;font-size:20px;padding:12px 14px;border-radius:10px;border:2px solid #444;background:#111;color:var(--ink);text-align:center}
.gate button{width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;background:#FFC000;color:#1c1c1c;font-weight:800;font-size:18px}
.gate .err{color:#ff6b6b;min-height:1.3em;margin-top:10px}

.f{display:flex;flex-direction:column;gap:12px}
.f label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{font:inherit;font-size:16px;color:var(--ink);background:#111;border:2px solid #3a3a3a;border-radius:10px;padding:10px 12px;width:100%;min-height:44px;-webkit-appearance:none;appearance:none}
.f textarea{min-height:70px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:#777;outline:none}
.f .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f .chk{flex-direction:row;align-items:center;gap:10px;color:var(--ink);font-size:16px}
.f .chk input{width:22px;height:22px;min-height:0;-webkit-appearance:checkbox;appearance:auto}
.f .race{display:none;flex-direction:column;gap:12px}
.f .race.on{display:flex}
.f .save{background:#FFC000;color:#1c1c1c;border:0;border-radius:10px;padding:13px;font-weight:800;font-size:18px;margin-top:4px;cursor:pointer}
.f .save:disabled{opacity:.5}
.f .err{color:#ff6b6b;min-height:1.2em;font-size:15px}
.rm{margin-left:auto;align-self:flex-start;background:none;border:1px solid #555;border-radius:8px;color:var(--muted);font-size:13px;font-weight:600;padding:5px 10px;cursor:pointer}
.rm:disabled{opacity:.5}
@media (prefers-reduced-motion: reduce){.sheet,.scrim{transition:none}}
</style>
</head>
<body>

<header class="bar" id="bar">
  <div class="bar-row">
    <div class="year">
      <button class="icon-btn" id="prev" aria-label="Previous year">‹</button>
      <h1 id="yr"></h1>
      <button class="icon-btn" id="next" aria-label="Next year">›</button>
    </div>
    <div class="seg" role="group" aria-label="View">
      <button id="v-outlook" aria-pressed="true">Outlook</button>
      <button id="v-activity" aria-pressed="false">Activity</button>
    </div>
    <button class="icon-btn" id="refresh" aria-label="Refresh">↻</button>
  </div>
  <div class="legend" id="legend"></div>
  <div class="summary" id="summary"></div>
  <div class="status" id="status"></div>
</header>

<main class="wrap" id="wrap"><div class="grid" id="grid"></div></main>

<button class="fab" id="fab" aria-label="Add to outlook">+</button>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="grab"></div>
  <div id="sheet-body"></div>
</section>

<div class="gate" id="gate">
  <form id="gate-form" autocomplete="off">
    <h2>Outlook</h2>
    <p>Enter your passcode</p>
    <input id="gate-input" type="password" inputmode="text" autocomplete="current-password" aria-label="Passcode">
    <button type="submit">Open</button>
    <div class="err" id="gate-err"></div>
  </form>
</div>

<script>
/* ======== CONFIG ======== */
const API_URL  = 'https://script.google.com/macros/s/AKfycbytxMyR1CfGNWHXdEgCn0mWwu7eRpBpIdhegMer5cWwQ0QOQXDWNk_-Qo-JB7X_EdgTkQ/exec';
/* ======================== */

const LS = { key: 'ao_key', cache: 'ao_cache' };
const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const DOW3 = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOW2 = ['Su','Mo','Tu','We','Th','Fr','Sa'];
const state = { year: new Date().getFullYear(), view: 'outlook', data: null, sel: null };
let I = { idx: {}, cats: {} };

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const ymd = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
const parseYmd = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };
const isBreak = cat => /school/i.test(cat || '');

/* ---------- data ---------- */
async function load() {
  const key = lsGet(LS.key);
  if (!key) return showGate();
  if (!state.data) {
    const c = lsGet(LS.cache);
    if (c) { try { state.data = JSON.parse(c); build(); render(); } catch (e) {} }
  }
  setStatus('Syncing…');
  try {
    const r = await fetch(API_URL + '?key=' + encodeURIComponent(key), { cache: 'no-store' });
    const j = await r.json();
    if (!j.ok) {
      if (j.error === 'unauthorized') {
        lsDel(LS.key); lsDel(LS.cache); state.data = null; $('grid').innerHTML = '';
        return showGate('That passcode didn\u2019t match. Try again.');
      }
      throw new Error(j.error || 'Unknown error');
    }
    state.data = j; lsSet(LS.cache, JSON.stringify(j));
    setStatus(''); build(); render();
  } catch (err) {
    setStatus(state.data ? 'Offline. Showing your last sync.' : 'Couldn\u2019t load the calendar: ' + err.message);
  }
}

function build() {
  const idx = {}, cats = {};
  (state.data.categories || []).forEach(c => {
    const name = String(c.Name || '').trim();
    if (!name) return;
    cats[name.toLowerCase()] = { name, color: String(c.Color || '#888'), order: +c.Order || 99, group: String(c.Group || 'Event') };
  });
  const day = k => idx[k] || (idx[k] = { ev: [], brk: [], wo: [] });
  (state.data.events || []).forEach(e => {
    const d = parseYmd(e.start), end = parseYmd(e.end || e.start);
    for (let g = 0; d <= end && g < 400; g++) {
      const o = day(ymd(d.getFullYear(), d.getMonth(), d.getDate()));
      (isBreak(e.category) ? o.brk : o.ev).push(e);
      d.setDate(d.getDate() + 1);
    }
  });
  (state.data.workouts || []).forEach(w => day(w.date).wo.push(w));
  I = { idx, cats };
}

const catColor = n => (I.cats[String(n || '').toLowerCase()] || {}).color || '#888888';

function splitBg(colors) {
  if (!colors.length) return '';
  if (colors.length === 1) return colors[0];
  const step = 100 / colors.length;
  return 'linear-gradient(to bottom right,' +
    colors.map((c, i) => `${c} ${(i * step).toFixed(2)}%, ${c} ${((i + 1) * step).toFixed(2)}%`).join(',') + ')';
}

/* ---------- render ---------- */
const isLandscape = () => window.matchMedia('(min-width: 900px)').matches;

function render() {
  $('yr').textContent = state.year;
  $('v-outlook').setAttribute('aria-pressed', state.view === 'outlook');
  $('v-activity').setAttribute('aria-pressed', state.view === 'activity');
  renderLegend();
  renderSummary();

  const land = isLandscape();
  const grid = $('grid');
  grid.className = 'grid ' + (land ? 'landscape' : 'portrait');
  $('wrap').className = 'wrap ' + (land ? 'landscape' : 'portrait');
  const narrow = !land && window.innerWidth < 560;
  const todayK = (() => { const t = new Date(); return ymd(t.getFullYear(), t.getMonth(), t.getDate()); })();
  const y = state.year;
  let h = '';

  if (land) {
    h += '<div class="corner"></div>';
    for (let d = 1; d <= 31; d++) h += `<div class="dn">${d}</div>`;
    for (let m = 0; m < 12; m++) {
      h += `<div class="mh">${MONTHS[m]}</div>`;
      for (let d = 1; d <= 31; d++) h += cell(y, m, d, false, todayK);
    }
  } else {
    for (let m = 0; m < 12; m++) h += `<div class="mh">${MONTHS[m]}</div>`;
    for (let d = 1; d <= 31; d++) for (let m = 0; m < 12; m++) h += cell(y, m, d, narrow, todayK);
  }
  grid.innerHTML = h;
  document.documentElement.style.setProperty('--bar-h', $('bar').offsetHeight + 'px');
}

function cell(y, m, d, narrow, todayK) {
  const dt = new Date(y, m, d);
  if (dt.getMonth() !== m) return '<div class="d void" aria-hidden="true"></div>';
  const k = ymd(y, m, d);
  const o = I.idx[k] || { ev: [], brk: [], wo: [] };
  const dow = dt.getDay();
  const hc = (dow === 0 || dow === 6) ? 'wk' : (o.brk.length ? 'brk' : '');
  let bg = '', label = '';
  if (state.view === 'outlook') {
    bg = splitBg(o.ev.map(e => catColor(e.category)));
    label = [...new Set(o.ev.map(e => e.label).filter(Boolean))].join(' / ');
  } else {
    bg = splitBg([...new Set(o.wo.map(w => w.type))].map(catColor));
  }
  const cls = 'd' + (k === todayK ? ' today' : '') + (k === state.sel ? ' sel' : '');
  const aria = `${DOW3[dow]} ${MONTHS[m]} ${d}${label ? ', ' + label : ''}`;
  return `<div class="${cls}" data-k="${k}" role="button" tabindex="0" aria-label="${esc(aria)}">` +
    `<div class="dh ${hc}"><span>${(narrow ? DOW2 : DOW3)[dow]}</span><span>${d}</span></div>` +
    `<div class="db"${bg ? ` style="background:${bg}"` : ''}><span>${esc(label)}</span></div></div>`;
}

function groupCats(group) {
  return Object.values(I.cats).filter(c => c.group.toLowerCase() === group).sort((a, b) => a.order - b.order);
}

function renderLegend() {
  const cats = groupCats(state.view === 'outlook' ? 'event' : 'workout');
  $('legend').innerHTML = cats.map(c => `<span class="chip" style="background:${esc(c.color)}">${esc(c.name)}</span>`).join('');
}

function renderSummary() {
  const el = $('summary');
  if (state.view !== 'activity' || !state.data) { el.innerHTML = ''; return; }
  const pre = state.year + '-';
  const days = new Set(), counts = {};
  (state.data.workouts || []).forEach(w => {
    if (!String(w.date).startsWith(pre)) return;
    days.add(w.date); counts[w.type] = (counts[w.type] || 0) + 1;
  });
  const parts = groupCats('workout').map(c => `${esc(c.name)} <b>${counts[c.name] || 0}</b>`);
  el.innerHTML = `Active days <b>${days.size}</b>&ensp;` + parts.join('&ensp;');
}

/* ---------- day sheet ---------- */
function fmtRange(e) {
  const o = { month: 'short', day: 'numeric' };
  const a = parseYmd(e.start).toLocaleDateString(undefined, o);
  return e.end && e.end !== e.start ? `${a} – ${parseYmd(e.end).toLocaleDateString(undefined, o)}` : a;
}

function openDay(k) {
  state.sel = k;
  const o = I.idx[k] || { ev: [], brk: [], wo: [] };
  const title = parseYmd(k).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  let h = `<h2 id="sheet-title">${esc(title)}</h2>`;

  if (o.brk.length) h += `<div class="item"><div class="sw" style="background:var(--brk)"></div><div><div class="item-t">${esc(o.brk[0].name || 'School break')}</div><div class="item-s">${esc(fmtRange(o.brk[0]))}</div></div></div>`;

  h += '<h3>Events</h3>';
  h += o.ev.length ? o.ev.map(e => {
    const bits = [e.category, fmtRange(e)];
    if (e.race) bits.push([e.sport, e.distance, e.priority && 'Priority ' + e.priority].filter(Boolean).join(', '));
    return `<div class="item"><div class="sw" style="background:${esc(catColor(e.category))}"></div><div>
      <div class="item-t">${esc(e.name || e.label)}</div>
      <div class="item-s">${bits.filter(Boolean).map(esc).join('<br>')}</div>
      ${e.location ? `<div class="item-s">${esc(e.location)}</div>` : ''}
      ${e.notes ? `<div class="item-s">${esc(e.notes)}</div>` : ''}</div>
      ${e.id ? `<button class="rm" data-id="${esc(e.id)}" data-n="${esc(e.name || e.label)}">Remove</button>` : ''}</div>`;
  }).join('') : '<p class="empty">Nothing planned.</p>';

  h += '<h3>Workouts</h3>';
  const byType = {};
  o.wo.forEach(w => {
    const g = byType[w.type] || (byType[w.type] = { n: 0, min: 0, mi: 0, names: [] });
    g.n++; g.min += Number(w.min) || 0; g.mi += Number(w.mi) || 0;
    if (w.name) g.names.push(w.name);
  });
  const types = Object.keys(byType);
  h += types.length ? types.map(t => {
    const g = byType[t];
    const bits = [g.min && Math.round(g.min) + ' min', g.mi && (Math.round(g.mi * 100) / 100) + ' mi'].filter(Boolean).join(', ');
    return `<div class="item"><div class="sw" style="background:${esc(catColor(t))}"></div><div>
      <div class="item-t">${esc(t)}${g.n > 1 ? ' \u00d7' + g.n : ''}</div>
      <div class="item-s">${bits ? esc(bits) + '<br>' : ''}${esc(g.names.join(', '))}</div></div></div>`;
  }).join('') : '<p class="empty">No workouts logged.</p>';

  $('sheet-body').innerHTML = h;
  $('scrim').classList.add('on'); $('sheet').classList.add('on');
  document.querySelectorAll('.d.sel').forEach(n => n.classList.remove('sel'));
  const n = document.querySelector(`.d[data-k="${k}"]`); if (n) n.classList.add('sel');
}

function closeDay() {
  state.sel = null;
  $('scrim').classList.remove('on'); $('sheet').classList.remove('on');
  document.querySelectorAll('.d.sel').forEach(n => n.classList.remove('sel'));
}

/* ---------- add / remove ---------- */
const SPORTS = ['Run', 'Bike', 'Tri', 'Ultra', 'Adventure', 'Other'];

async function post(body) {
  const key = lsGet(LS.key);
  const r = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids a CORS preflight
    body: JSON.stringify(Object.assign({ key }, body))
  });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Save failed');
  return j;
}

function openAdd(dateK) {
  const t = new Date();
  const d = dateK || ymd(t.getFullYear(), t.getMonth(), t.getDate());
  const cats = groupCats('event');
  const opt = a => a.map(x => `<option>${esc(x)}</option>`).join('');
  $('sheet-body').innerHTML = `<h2 id="sheet-title">Add to outlook</h2>
  <form class="f" id="addf" novalidate>
    <label>Label (shows in the cell)<input name="label" maxlength="12" required placeholder="POF"></label>
    <label>Full name<input name="name" placeholder="Prairie on Fire"></label>
    <label>Category<select name="category" required>${opt(cats.map(c => c.name))}</select></label>
    <div class="row">
      <label>Start<input type="date" name="start" value="${d}" required></label>
      <label>End (optional)<input type="date" name="end"></label>
    </div>
    <label class="chk"><input type="checkbox" name="race"> Race or adventure</label>
    <div class="race" id="racef">
      <div class="row">
        <label>Sport<select name="sport">${opt(SPORTS)}</select></label>
        <label>Priority<select name="priority"><option></option>${opt(['A','B','C'])}</select></label>
      </div>
      <label>Distance<input name="distance" placeholder="100K"></label>
    </div>
    <label>Location<input name="location"></label>
    <label>Notes<textarea name="notes"></textarea></label>
    <div class="err" id="adderr"></div>
    <button class="save" type="submit">Save</button>
  </form>`;
  const f = $('addf');
  f.race.onchange = () => $('racef').classList.toggle('on', f.race.checked);
  f.start.onchange = () => { if (f.end.value && f.end.value < f.start.value) f.end.value = ''; };
  f.onsubmit = async ev => {
    ev.preventDefault();
    const err = $('adderr'); err.textContent = '';
    if (!f.label.value.trim()) return err.textContent = 'Add a label.';
    if (!f.start.value) return err.textContent = 'Pick a start date.';
    if (f.end.value && f.end.value < f.start.value) return err.textContent = 'End date is before the start date.';
    const btn = f.querySelector('.save'); btn.disabled = true; btn.textContent = 'Saving…';
    try {
      await post({ action: 'add', event: {
        label: f.label.value.trim(), name: f.name.value.trim(), category: f.category.value,
        start: f.start.value, end: f.end.value, race: f.race.checked,
        sport: f.sport.value, priority: f.priority.value, distance: f.distance.value.trim(),
        location: f.location.value.trim(), notes: f.notes.value.trim()
      }});
      closeDay();
      const y = +f.start.value.slice(0, 4); if (y !== state.year) state.year = y;
      await load();
    } catch (x) {
      err.textContent = x.message; btn.disabled = false; btn.textContent = 'Save';
    }
  };
  $('scrim').classList.add('on'); $('sheet').classList.add('on');
  $('sheet').scrollTop = 0;
}

$('sheet-body').addEventListener('click', async e => {
  const b = e.target.closest('.rm'); if (!b) return;
  if (!confirm(`Remove "${b.dataset.n}"? This removes every day of it.`)) return;
  b.disabled = true; b.textContent = 'Removing…';
  try { await post({ action: 'cancel', id: b.dataset.id }); closeDay(); await load(); }
  catch (x) { b.disabled = false; b.textContent = 'Remove'; alert(x.message); }
});

/* ---------- gate ---------- */
function showGate(msg) { $('gate').classList.add('on'); $('gate-err').textContent = msg || ''; setTimeout(() => $('gate-input').focus(), 50); }
$('gate-form').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('gate-input').value.trim();
  if (!v) return;
  lsSet(LS.key, v); $('gate-input').value = ''; $('gate').classList.remove('on'); load();
});

/* ---------- wiring ---------- */
function setStatus(t) { $('status').textContent = t; }
$('fab').onclick = () => openAdd();
$('prev').onclick = () => { state.year--; closeDay(); render(); };
$('next').onclick = () => { state.year++; closeDay(); render(); };
$('refresh').onclick = () => load();
$('v-outlook').onclick = () => { state.view = 'outlook'; render(); };
$('v-activity').onclick = () => { state.view = 'activity'; render(); };
$('scrim').onclick = closeDay;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDay(); });
$('grid').addEventListener('click', e => { const c = e.target.closest('.d[data-k]'); if (c) openDay(c.dataset.k); });
$('grid').addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const c = e.target.closest('.d[data-k]'); if (c) { e.preventDefault(); openDay(c.dataset.k); }
});
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (state.data) render(); }, 150); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && lsGet(LS.key)) load(); });

render();
load();
</script>
</body>
</html>
